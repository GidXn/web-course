<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Тест парсера</title>
</head>
<body>
  <!-- 1. Незакритий елемент -->
  <p>Перший абзац
  <p>Другий абзац

  <!-- 2. Перетин елементів -->
  <p><b>жирний <i>обидва</b> курсив</i></p>

  <!-- 3. Блоковий елемент усередині p -->
  <p><div>Блок</div></p>

  <!-- 4. Некоректна вкладеність у списку -->
  <ul>
    <li>Пункт 1</li>
    <ul>
      <li>Вкладений пункт</li>
    </ul>
    <p>Абзац прямо в ul</p>
  </ul>

  <!-- 5. Незакритий div -->
  <div>Незакритий блок
</body>
</html>
